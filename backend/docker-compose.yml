services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-vercel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mini_vercel
      POSTGRES_PASSWORD: mini_vercel
      POSTGRES_DB: mini_vercel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_vercel -d mini_vercel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
